<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dar Alta de Huésped</title>
    <link rel="stylesheet" href="styles.css"> </head>
<body>

    <header class="header">
        <img class="logo" src="logo_hotel.png" alt="Logo del Hotel Premier">
        <nav class="nav">
            <a href="#">Huéspedes</a>
            <a href="#">Reservas</a>
            <a href="#">Home</a>
        </nav>
        <div class="user-menu">
            <div class="user-avatar">U</div>
            <div class="menu-icon">☰</div>
        </div>
    </header>

    <div class="main-container">
        <h1>Dar Alta de Huésped</h1>

        <div class="form-card">
            <h2>Datos del huésped</h2>

            <form class="guest-form">

                <div class="form-group span-6">
                    <label for="nombre">Nombre (*)</label>
                    <input type="text" id="nombre" placeholder="Ingrese un Nombre" required>
                </div>
                <div class="form-group span-6">
                    <label for="apellido">Apellido (*)</label>
                    <input type="text" id="apellido" placeholder="Ingrese un Apellido" required>
                </div>

                <div class="form-group span-6">
                    <label for="tipo-doc">Tipo de Documento (*)</label>
                    <select id="tipo-doc" required>
                        <option value="">Seleccionar Tipo de Documento</option>
                    </select>
                </div>
                <div class="form-group span-6">
                    <label for="nro-doc">Número de Documento (*)</label>
                    <input type="text" id="nro-doc" placeholder="Ingrese el Número de Documento" required>
                </div>

                <div class="form-group span-6">
                    <label for="cuit">CUIT</label>
                    <input type="text" id="cuit" placeholder="Ingrese el CUIT">
                </div>
                <div class="form-group span-6">
                    <label for="posicion-iva">Posición Frente al IVA (*)</label>
                    <select id="posicion-iva" required>
                        <option value="cf">Consumidor Final</option>
                    </select>
                </div>

                <div class="form-group span-6">
                    <label for="telefono">Teléfono (*)</label>
                    <input type="tel" id="telefono" placeholder="Ingrese el Teléfono" required>
                </div>
                <div class="form-group span-6">
                    <label for="fecha-nac">Fecha de Nacimiento (*)</label>
                    <div class="input-with-icon">
                        <input type="date" id="fecha-nac" placeholder="DD/MM/AAAA" required>
                    </div>
                </div>

                <div class="form-group span-12">
                    <label class="domicilio-label">Domicilio</label>
                </div>

                <div class="form-group span-6 street-number-group">
                    <div class="inline-input">
                        <label for="calle">Calle (*)</label>
                        <input type="text" id="calle" placeholder="Ingrese la calle" required>
                    </div>
                    <div class="inline-input number-input">
                        <label for="numero">Número (*)</label>
                        <input type="text" id="numero" placeholder="Ingrese el número" required>
                    </div>
                </div>
                <div class="form-group span-6">
                    </div>


                <div class="form-group span-6">
                    <label for="ocupacion">Ocupación (*)</label>
                    <input type="text" id="ocupacion" placeholder="Ingrese la Ocupación" required>
                </div>
                <div class="form-group span-6 dept-floor-group">
                    <div class="inline-input">
                        <label for="departamento">Departamento</label>
                        <input type="text" id="departamento" placeholder="Nro. Departamento">
                    </div>
                    <div class="inline-input floor-input">
                        <label for="piso">Piso</label>
                        <input type="text" id="piso" placeholder="Nro. Piso">
                    </div>
                </div>


                <div class="form-group span-6">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Ingrese el Email">
                </div>
                <div class="form-group span-6 postcode-location-group">
                    <div class="inline-input">
                        <label for="cod-postal">Código Postal (*)</label>
                        <input type="text" id="cod-postal" placeholder="Cod. Postal" required>
                    </div>
                    <div class="inline-input location-select">
                        <label for="localidad">Localidad (*)</label>
                        <select id="localidad" required>
                            <option value="">Localidad</option>
                        </select>
                    </div>
                </div>


                <div class="form-group span-6">
                    <label for="nacionalidad">Nacionalidad (*)</label>
                    <select id="nacionalidad" required>
                        <option value="argentina">Argentina</option>
                    </select>
                </div>
                <div class="form-group span-6 province-country-group">
                    <div class="inline-input">
                        <label for="provincia">Provincia (*)</label>
                        <select id="provincia" required>
                            <option value="">Provincia</option>
                        </select>
                    </div>
                    <div class="inline-input country-select">
                        <label for="pais">País (*)</label>
                        <select id="pais" required>
                            <option value="">País</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions span-12">
                    <p class="required-note">(*) Campo obligatorio</p>
                    <div class="buttons-container">
                        <button type="button" class="btn btn-cancelar">CANCELAR</button>
                        <button type="submit" class="btn btn-siguiente">SIGUIENTE</button>
                    </div>
                </div>

            </form>
        </div>
    </div>

</body>
</html>
