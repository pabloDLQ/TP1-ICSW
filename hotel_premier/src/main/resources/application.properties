spring.application.name=hotel_premier
server.port=8080

# Conexión a MySQL (Docker)
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_premier?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate: crea/actualiza tablas
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto MySQL
# Dialecto: Hibernate lo detecta automáticamente; evitamos el warning
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
