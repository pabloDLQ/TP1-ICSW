name: CI Build

# Se ejecuta en cada Pull Request y en cada push a main o develop
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-java:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compilar clases Java
        run: javac java/src/*.java

      - name: Ejecutar Main
        run: java -cp java/src Main